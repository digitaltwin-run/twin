[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "subactor-twin-standard"
version = "0.1.0.dev0"
description = "Language-neutral Digital Twin contract validator and generator"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
twin-standard = "0.20.35"

[tool.setuptools]
py-modules = ["twin_standard"]
package-dir = {"" = "src"}

[tool.wellmanifest]
standard = "0.20.35"
revision = "cfaa0bf0ea6b0e7349fed0bb62b5ce15792d687d"
gate = "project/governance-check.sh"

[tool.pytest.ini_options]
addopts = "-p wellmanifest_governance"
