[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "subactor-twin-standard"
version = "0.1.0.dev0"
description = "Language-neutral Digital Twin contract validator and generator"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
twin-standard = "twin_standard:main"

[tool.setuptools]
py-modules = ["twin_standard"]
package-dir = {"" = "src"}

[tool.wellmanifest]
standard = "0.20.14"
revision = "e65857ea2f62b20e4b830e3c5f611878bf31bb25"
gate = "project/governance-check.sh"

[tool.pytest.ini_options]
addopts = "-p wellmanifest_governance"
