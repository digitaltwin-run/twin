syntax = "proto3";

package subactor.twin.v1;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

message ActorRef {
  string subject = 1;
  string tenant = 2;
}

message AuthorityRef {
  string decision_id = 1;
  string policy_version = 2;
}

message EvidenceRef {
  string evidence_id = 1;
  string aggregate_id = 2;
  string target_uri = 3;
  string media_type = 4;
  bytes digest_sha256 = 5;
}

message CommandEnvelope {
  string operation_id = 1;
  string command_id = 2;
  string aggregate_id = 3;
  string aggregate_type = 4;
  uint64 expected_version = 5;
  string idempotency_key = 6;
  ActorRef actor_ref = 7;
  AuthorityRef authority_ref = 8;
  string correlation_id = 9;
  string causation_id = 10;
  google.protobuf.Timestamp occurred_at = 11;
  google.protobuf.Any payload = 12;
}

message EventEnvelope {
  string event_id = 1;
  string aggregate_id = 2;
  string aggregate_type = 3;
  uint64 aggregate_version = 4;
  uint64 sequence = 5;
  string event_type = 6;
  uint32 schema_version = 7;
  ActorRef actor_ref = 8;
  AuthorityRef authority_ref = 9;
  string correlation_id = 10;
  string causation_id = 11;
  string idempotency_key = 12;
  google.protobuf.Timestamp occurred_at = 13;
  repeated EvidenceRef evidence = 14;
  google.protobuf.Any payload = 15;
}

message QueryEnvelope {
  string operation_id = 1;
  string query_id = 2;
  string aggregate_id = 3;
  ActorRef actor_ref = 4;
  string correlation_id = 5;
  google.protobuf.Any parameters = 6;
}

message CommandReceipt {
  string receipt_id = 1;
  string command_id = 2;
  string aggregate_id = 3;
  AuthorityRef authority_ref = 4;
  uint64 aggregate_version = 5;
  repeated string event_ids = 6;
  string status = 7;
}

message QueryResult {
  string query_id = 1;
  string projection = 2;
  uint64 source_sequence = 3;
  google.protobuf.Timestamp projected_at = 4;
  repeated EvidenceRef evidence = 5;
  google.protobuf.Any payload = 6;
}

enum ObservationStatus {
  OBSERVATION_STATUS_UNSPECIFIED = 0;
  OBSERVATION_STATUS_OBSERVED = 1;
  OBSERVATION_STATUS_UNEVALUABLE = 2;
  OBSERVATION_STATUS_EXPIRED = 3;
}

message Observation {
  string observation_id = 1;
  string aggregate_id = 2;
  string target_uri = 3;
  string metric = 4;
  ObservationStatus status = 5;
  google.protobuf.Any value = 6;
  google.protobuf.Timestamp observed_at = 7;
  google.protobuf.Timestamp expires_at = 8;
  repeated EvidenceRef evidence = 9;
}

message OutboxMessage {
  string message_id = 1;
  string aggregate_id = 2;
  string operation = 3;
  string target_uri = 4;
  string credential_ref = 5;
  google.protobuf.Any payload = 6;
  repeated string source_event_ids = 7;
}

enum UriEffect {
  URI_EFFECT_UNSPECIFIED = 0;
  URI_EFFECT_QUERY = 1;
  URI_EFFECT_COMMAND = 2;
}

message UriRoute {
  string uri = 1;
  string scheme = 2;
  string uri_authority = 3;
  repeated string resource_path = 4;
  UriEffect effect = 5;
  string action = 6;
}

message UriProvider {
  string connector_ref = 1;
  UriRoute route = 2;
  repeated string preconditions = 3;
}

message UriCapability {
  string capability_id = 1;
  string twin_family = 2;
  UriEffect effect = 3;
  string transport = 4;
  string status = 5;
  string risk = 6;
  repeated string credential_refs = 7;
  repeated string required_capability_ids = 8;
  repeated string required_feature_flags = 9;
  repeated UriProvider providers = 10;
}

enum ResolutionGapKind {
  RESOLUTION_GAP_KIND_UNSPECIFIED = 0;
  RESOLUTION_GAP_KIND_CONNECTOR_UNAVAILABLE = 1;
  RESOLUTION_GAP_KIND_PROVIDER_NOT_IMPLEMENTED = 2;
  RESOLUTION_GAP_KIND_CREDENTIAL_MISSING = 3;
  RESOLUTION_GAP_KIND_CAPABILITY_MISSING = 4;
  RESOLUTION_GAP_KIND_PRECONDITION_FAILED = 5;
  RESOLUTION_GAP_KIND_AUTHORITY_MISSING = 6;
}

message ResolutionGap {
  ResolutionGapKind kind = 1;
  string capability_id = 2;
  string detail = 3;
  string execution_policy = 4;
}

message CapabilityMap {
  string map_hash = 1;
  string baseline_version = 2;
  google.protobuf.Timestamp observed_at = 3;
  repeated UriCapability capabilities = 4;
  repeated EvidenceRef evidence = 5;
}

enum ProcessFailurePolicy {
  PROCESS_FAILURE_POLICY_UNSPECIFIED = 0;
  PROCESS_FAILURE_POLICY_STOP = 1;
  PROCESS_FAILURE_POLICY_CONTINUE = 2;
  PROCESS_FAILURE_POLICY_COMPENSATE = 3;
}

message RetryPolicy {
  uint32 max_attempts = 1;
  uint64 backoff_ms = 2;
}

message UriProcessStep {
  string step_id = 1;
  string operation_id = 2;
  UriRoute route = 3;
  repeated string depends_on = 4;
  uint64 timeout_ms = 5;
  RetryPolicy retry = 6;
  ProcessFailurePolicy failure_policy = 7;
  bool reversible = 8;
  string inverse_uri = 9;
  string authority_scope = 10;
  string capability_id = 11;
  string provider_ref = 12;
  bool idempotency_required = 13;
  bool receipt_required = 14;
}

message UriProcessDefinition {
  string process_id = 1;
  string process_uri = 2;
  uint32 version = 3;
  string intent = 4;
  repeated UriProcessStep steps = 5;
  bool immutable = 6;
}

message UriProcessPlan {
  string plan_id = 1;
  string process_id = 2;
  uint32 process_version = 3;
  string capability_map_hash = 4;
  bool resolved = 5;
  repeated UriProcessStep steps = 6;
  repeated ResolutionGap gaps = 7;
  google.protobuf.Timestamp resolved_at = 8;
}

enum UriProcessRunState {
  URI_PROCESS_RUN_STATE_UNSPECIFIED = 0;
  URI_PROCESS_RUN_STATE_PLANNED = 1;
  URI_PROCESS_RUN_STATE_WAITING = 2;
  URI_PROCESS_RUN_STATE_READY = 3;
  URI_PROCESS_RUN_STATE_RUNNING = 4;
  URI_PROCESS_RUN_STATE_SUCCEEDED = 5;
  URI_PROCESS_RUN_STATE_FAILED = 6;
  URI_PROCESS_RUN_STATE_CANCELLED = 7;
  URI_PROCESS_RUN_STATE_COMPENSATING = 8;
  URI_PROCESS_RUN_STATE_COMPENSATED = 9;
}

message UriStepReceipt {
  string receipt_id = 1;
  string run_id = 2;
  string step_id = 3;
  string operation_uri = 4;
  uint32 attempt = 5;
  string idempotency_key = 6;
  string status = 7;
  repeated string event_ids = 8;
  repeated EvidenceRef evidence = 9;
  bytes output_digest_sha256 = 10;
  google.protobuf.Timestamp started_at = 11;
  google.protobuf.Timestamp finished_at = 12;
  string error_ref = 13;
}

enum HumanTaskState {
  HUMAN_TASK_STATE_UNSPECIFIED = 0;
  HUMAN_TASK_STATE_PENDING = 1;
  HUMAN_TASK_STATE_RESOLVED = 2;
  HUMAN_TASK_STATE_DECLINED = 3;
  HUMAN_TASK_STATE_CANCELLED = 4;
  HUMAN_TASK_STATE_EXPIRED = 5;
}

message HumanTask {
  string task_id = 1;
  string run_id = 2;
  string step_id = 3;
  HumanTaskState state = 4;
  ActorRef requested_actor_ref = 5;
  string required_authority_scope = 6;
  AuthorityRef decision_ref = 7;
  repeated EvidenceRef evidence = 8;
}

message UriProcessRun {
  string run_id = 1;
  string plan_id = 2;
  string capability_map_hash = 3;
  UriProcessRunState state = 4;
  repeated string current_step_ids = 5;
  ActorRef actor_ref = 6;
  AuthorityRef authority_ref = 7;
  string correlation_id = 8;
  repeated UriStepReceipt step_receipts = 9;
  repeated HumanTask human_tasks = 10;
  repeated ResolutionGap gaps = 11;
  google.protobuf.Timestamp started_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  google.protobuf.Timestamp finished_at = 14;
}

message ContractSourceRef {
  string source_id = 1;
  string role = 2;
  string repository = 3;
  string revision = 4;
  string artifact = 5;
  string digest_sha256 = 6;
}

message ModuleContractRef {
  string module_id = 1;
  string repository = 2;
  string revision = 3;
  string contract_uri = 4;
  string contract_version = 5;
  string contract_digest_sha256 = 6;
  string layer = 7;
  string owner = 8;
  bool state_writer = 9;
  repeated string depends_on = 10;
}

message LifecycleBlueprintRef {
  string blueprint_id = 1;
  string version = 2;
  string definition_uri = 3;
  string definition_digest_sha256 = 4;
  repeated string stage_ids = 5;
  bool immutable = 6;
}

enum LifecycleTransitionStatus {
  LIFECYCLE_TRANSITION_STATUS_UNSPECIFIED = 0;
  LIFECYCLE_TRANSITION_STATUS_REQUESTED = 1;
  LIFECYCLE_TRANSITION_STATUS_APPROVED = 2;
  LIFECYCLE_TRANSITION_STATUS_BLOCKED = 3;
  LIFECYCLE_TRANSITION_STATUS_REJECTED = 4;
}

message LifecycleTransitionRecord {
  string transition_id = 1;
  LifecycleBlueprintRef blueprint = 2;
  string from_stage = 3;
  string to_stage = 4;
  string base_revision = 5;
  LifecycleTransitionStatus status = 6;
  repeated EvidenceRef evidence = 7;
  repeated string unmet_criteria = 8;
  ActorRef requested_by = 9;
  ActorRef approved_by = 10;
  string gate_decision_id = 11;
  google.protobuf.Timestamp recorded_at = 12;
}

enum EvolutionMode {
  EVOLUTION_MODE_UNSPECIFIED = 0;
  EVOLUTION_MODE_ANALYSIS_ONLY = 1;
  EVOLUTION_MODE_CHANGE_PLAN = 2;
  EVOLUTION_MODE_AUTO_APPLY_SAFE = 3;
}

enum EvolutionCandidateStatus {
  EVOLUTION_CANDIDATE_STATUS_UNSPECIFIED = 0;
  EVOLUTION_CANDIDATE_STATUS_PROPOSED = 1;
  EVOLUTION_CANDIDATE_STATUS_SHORTLISTED = 2;
  EVOLUTION_CANDIDATE_STATUS_SELECTED = 3;
  EVOLUTION_CANDIDATE_STATUS_REJECTED = 4;
  EVOLUTION_CANDIDATE_STATUS_REALIZED = 5;
  EVOLUTION_CANDIDATE_STATUS_VERIFIED = 6;
}

enum EvolutionRunStatus {
  EVOLUTION_RUN_STATUS_UNSPECIFIED = 0;
  EVOLUTION_RUN_STATUS_DRAFT = 1;
  EVOLUTION_RUN_STATUS_COMPILED = 2;
  EVOLUTION_RUN_STATUS_RUNNING = 3;
  EVOLUTION_RUN_STATUS_BLOCKED = 4;
  EVOLUTION_RUN_STATUS_AWAITING_APPROVAL = 5;
  EVOLUTION_RUN_STATUS_COMPLETED = 6;
  EVOLUTION_RUN_STATUS_FAILED = 7;
  EVOLUTION_RUN_STATUS_CANCELLED = 8;
}

enum EvolutionQueueState {
  EVOLUTION_QUEUE_STATE_UNSPECIFIED = 0;
  EVOLUTION_QUEUE_STATE_QUEUED = 1;
  EVOLUTION_QUEUE_STATE_APPLYING = 2;
  EVOLUTION_QUEUE_STATE_REGENERATING = 3;
  EVOLUTION_QUEUE_STATE_VERIFYING = 4;
  EVOLUTION_QUEUE_STATE_APPLIED = 5;
  EVOLUTION_QUEUE_STATE_REVERTED = 6;
  EVOLUTION_QUEUE_STATE_FAILED = 7;
}

message EvolutionChange {
  string operation_id = 1;
  string kind = 2;
  string target_uri = 3;
  string module_id = 4;
  google.protobuf.Any arguments = 5;
  bool reversible = 6;
  repeated string validation_steps = 7;
}

message EvolutionCandidate {
  string candidate_id = 1;
  uint32 generation = 2;
  repeated string parent_candidate_ids = 3;
  EvolutionCandidateStatus status = 4;
  repeated string methods = 5;
  repeated EvolutionChange proposed_changes = 6;
  repeated string module_ids = 7;
  string evaluation_digest_sha256 = 8;
  repeated EvidenceRef evidence = 9;
}

message EvolutionPlan {
  string plan_id = 1;
  string run_id = 2;
  string base_revision = 3;
  string modularity_graph_digest_sha256 = 4;
  string lifecycle_transition_id = 5;
  string lifecycle_stage = 6;
  uint64 deterministic_seed = 7;
  EvolutionMode mode = 8;
  repeated ModuleContractRef module_contracts = 9;
  repeated EvolutionCandidate candidates = 10;
  repeated string selected_candidate_ids = 11;
  string plan_digest_sha256 = 12;
  bool allowlisted = 13;
  bool reversible = 14;
  bool compatibility_validated = 15;
  repeated ContractSourceRef source_contracts = 16;
}

message EvolutionQueueItem {
  string queue_item_id = 1;
  string plan_id = 2;
  EvolutionQueueState state = 3;
  string command_id = 4;
  string source_event_id = 5;
  repeated string affected_module_ids = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message EvolutionRun {
  string run_id = 1;
  string base_revision = 2;
  string current_revision = 3;
  string lifecycle_stage = 4;
  EvolutionRunStatus status = 5;
  EvolutionMode mode = 6;
  repeated EvolutionCandidate candidates = 7;
  repeated string selected_candidate_ids = 8;
  repeated EvolutionQueueItem change_queue = 9;
  repeated EvidenceRef evidence = 10;
  string regenerated_artifact_digest_sha256 = 11;
  string readback_digest_sha256 = 12;
}

message ReconcileCommand { CommandEnvelope envelope = 1; }
message MirrorRefreshCommand { CommandEnvelope envelope = 1; }
message InvariantEvaluationCommand { CommandEnvelope envelope = 1; }
message SimulationCommand { CommandEnvelope envelope = 1; }
message VerificationCommand { CommandEnvelope envelope = 1; }
message NotificationCommand { CommandEnvelope envelope = 1; }
message OutboxAcknowledgeCommand { CommandEnvelope envelope = 1; }
message PublishObservationCommand {
  CommandEnvelope envelope = 1;
  Observation observation = 2;
}

message GetTwinQuery { QueryEnvelope envelope = 1; }
message GetHistoryQuery { QueryEnvelope envelope = 1; }
message GetHealthQuery { QueryEnvelope envelope = 1; }

message StartUriProcessCommand {
  CommandEnvelope envelope = 1;
  UriProcessPlan plan = 2;
}
message AdvanceUriProcessCommand {
  CommandEnvelope envelope = 1;
  UriStepReceipt step_receipt = 2;
}
message CancelUriProcessCommand {
  CommandEnvelope envelope = 1;
  string reason = 2;
}

message ResolveUriProcessQuery {
  QueryEnvelope envelope = 1;
  UriProcessDefinition definition = 2;
}
message GetCapabilityMapQuery { QueryEnvelope envelope = 1; }
message GetUriProcessRunQuery { QueryEnvelope envelope = 1; }

message TransitionLifecycleCommand {
  CommandEnvelope envelope = 1;
  LifecycleTransitionRecord transition = 2;
}
message PlanEvolutionCommand {
  CommandEnvelope envelope = 1;
  EvolutionPlan plan = 2;
}
message ApplyEvolutionCommand {
  CommandEnvelope envelope = 1;
  string plan_id = 2;
  string expected_base_revision = 3;
  string lifecycle_transition_id = 4;
  repeated string selected_candidate_ids = 5;
  string expected_plan_digest_sha256 = 6;
}
message RevertEvolutionCommand {
  CommandEnvelope envelope = 1;
  string applied_event_id = 2;
  string expected_current_revision = 3;
  string reason = 4;
}

message GetLifecycleQuery { QueryEnvelope envelope = 1; }
message GetEvolutionQuery { QueryEnvelope envelope = 1; }

message TwinView { QueryResult result = 1; }
message HistoryView { QueryResult result = 1; }
message HealthView { QueryResult result = 1; }
message LifecycleView {
  QueryResult result = 1;
  LifecycleBlueprintRef blueprint = 2;
  string current_stage = 3;
  repeated LifecycleTransitionRecord transitions = 4;
}
message EvolutionView {
  QueryResult result = 1;
  EvolutionRun run = 2;
}

message ReconciliationRequested { string target_uri = 1; }
message MirrorRefreshRequested { string target_uri = 1; }
message InvariantEvaluated { string invariant_id = 1; bool satisfied = 2; }
message SimulationRecorded { string scenario_id = 1; }
message VerificationRecorded { string check_id = 1; bool eligible = 2; }
message NotificationEnqueued { OutboxMessage message = 1; }
message OutboxAcknowledged { string message_id = 1; string outcome = 2; }
message ObservationPublished { Observation observation = 1; }
message UriProcessStarted { string run_id = 1; string plan_id = 2; }
message UriProcessStepCompleted { UriStepReceipt step_receipt = 1; }
message UriProcessCancelled { string run_id = 1; string reason = 2; }
message LifecycleTransitionRecorded { LifecycleTransitionRecord transition = 1; }
message EvolutionPlanned { EvolutionPlan plan = 1; }
message EvolutionApplied {
  string plan_id = 1;
  string base_revision = 2;
  string new_revision = 3;
  repeated string affected_module_ids = 4;
  EvolutionQueueItem queue_item = 5;
  repeated EvidenceRef evidence = 6;
  string regenerated_artifact_digest_sha256 = 7;
  string readback_digest_sha256 = 8;
}
message EvolutionReverted {
  string applied_event_id = 1;
  string reverted_revision = 2;
  string restored_revision = 3;
  repeated string affected_module_ids = 4;
  EvolutionQueueItem queue_item = 5;
  repeated EvidenceRef evidence = 6;
  string regenerated_artifact_digest_sha256 = 7;
  string readback_digest_sha256 = 8;
}

message AppendEventsRequest {
  string aggregate_id = 1;
  uint64 expected_version = 2;
  repeated EventEnvelope events = 3;
}

message AppendEventsResponse {
  uint64 aggregate_version = 1;
  repeated string event_ids = 2;
}

message ReadStreamRequest {
  string aggregate_id = 1;
  uint64 after_sequence = 2;
  uint32 limit = 3;
}

message ReadStreamResponse { repeated EventEnvelope events = 1; }

message RebuildProjectionRequest {
  string projection = 1;
  uint64 through_sequence = 2;
  bool observe_only = 3;
}

message RebuildProjectionResponse {
  string projection = 1;
  uint64 source_sequence = 2;
}

service TwinCommandService {
  rpc Reconcile(ReconcileCommand) returns (CommandReceipt);
  rpc RefreshMirror(MirrorRefreshCommand) returns (CommandReceipt);
  rpc EvaluateInvariant(InvariantEvaluationCommand) returns (CommandReceipt);
  rpc Simulate(SimulationCommand) returns (CommandReceipt);
  rpc Verify(VerificationCommand) returns (CommandReceipt);
  rpc EnqueueNotification(NotificationCommand) returns (CommandReceipt);
  rpc AcknowledgeOutbox(OutboxAcknowledgeCommand) returns (CommandReceipt);
  rpc PublishObservation(PublishObservationCommand) returns (CommandReceipt);
  rpc TransitionLifecycle(TransitionLifecycleCommand) returns (CommandReceipt);
  rpc PlanEvolution(PlanEvolutionCommand) returns (CommandReceipt);
  rpc ApplyEvolution(ApplyEvolutionCommand) returns (CommandReceipt);
  rpc RevertEvolution(RevertEvolutionCommand) returns (CommandReceipt);
}

service TwinQueryService {
  rpc GetTwin(GetTwinQuery) returns (TwinView);
  rpc GetHistory(GetHistoryQuery) returns (HistoryView);
  rpc GetHealth(GetHealthQuery) returns (HealthView);
  rpc GetLifecycle(GetLifecycleQuery) returns (LifecycleView);
  rpc GetEvolution(GetEvolutionQuery) returns (EvolutionView);
}

service TwinEventStore {
  rpc Append(AppendEventsRequest) returns (AppendEventsResponse);
  rpc Read(ReadStreamRequest) returns (ReadStreamResponse);
}

service TwinProjectionService {
  rpc Rebuild(RebuildProjectionRequest) returns (RebuildProjectionResponse);
}

service TwinUriProcessCommandService {
  rpc Start(StartUriProcessCommand) returns (CommandReceipt);
  rpc Advance(AdvanceUriProcessCommand) returns (CommandReceipt);
  rpc Cancel(CancelUriProcessCommand) returns (CommandReceipt);
}

service TwinUriProcessQueryService {
  rpc Resolve(ResolveUriProcessQuery) returns (UriProcessPlan);
  rpc GetCapabilityMap(GetCapabilityMapQuery) returns (CapabilityMap);
  rpc GetRun(GetUriProcessRunQuery) returns (UriProcessRun);
}
