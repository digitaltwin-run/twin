name: twin-ci

on:
  push:
  pull_request:
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_review'
    permissions:
      contents: read
      pull-requests: read
    uses: wellmanifest/new-project/.github/workflows/governance.yml@f7fe7163e886d5540cedf83d383b6dd99daafd7c
    with:
      standard-ref: f7fe7163e886d5540cedf83d383b6dd99daafd7c
      trusted-validator-apps: 'ifuri-validator-agent[bot]'

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate contracts and tests
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 -m json.tool .governance/manifest.json >/dev/null
          python3 -m json.tool .governance/manifest.lock.json >/dev/null
          if [[ -d tests ]]; then
            PYTHONPATH=src python3 -m unittest discover -s tests -v
          fi
          if [[ "${{ github.ref_name }}" == "${{ github.event.repository.default_branch }}" ]]; then
            echo "Protected merge receipt is terminal; skipping ticket-governance replay."
          elif [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "pull_request_review" ]]; then
            if [[ -z "$EVENT_BASE_REF" || "$EVENT_BASE_REF" == *..* || "$EVENT_BASE_REF" == /* ]]; then
              echo "Event governance requires a safe base ref." >&2
              exit 1
            fi
            if [[ ! "$EVENT_HEAD" =~ ^[0-9a-f]{40}$ || "$EVENT_HEAD" == 0000000000000000000000000000000000000000 ]]; then
              echo "Event governance requires an exact non-zero head SHA." >&2
              exit 1
            fi
            git fetch --no-tags origin "+refs/heads/${EVENT_BASE_REF}:refs/remotes/origin/${EVENT_BASE_REF}"
            base="$(git merge-base "origin/${EVENT_BASE_REF}" "$EVENT_HEAD")"
            if [[ ! "$base" =~ ^[0-9a-f]{40}$ || "$base" == 0000000000000000000000000000000000000000 ]]; then
              echo "Event governance requires an exact non-zero merge base." >&2
              exit 1
            fi
            ./project/governance-check.sh --actor ci --base "$base" --head "$EVENT_HEAD"
          else
            git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
            base="$(git merge-base "origin/${DEFAULT_BRANCH}" "$EVENT_HEAD")"
            if [[ ! "$base" =~ ^[0-9a-f]{40}$ || "$base" == 0000000000000000000000000000000000000000 ]]; then
              echo "Event governance requires an exact non-zero merge base." >&2
              exit 1
            fi
            ./project/governance-check.sh --actor ci --base "$base" --head "$EVENT_HEAD"
          fi
      - name: Validate networkless container
        shell: bash
        run: |
          set -euo pipefail
          docker build -t twin-ci .
          docker run --rm --network none twin-ci

  windows-governance:
    runs-on: windows-latest
    steps:
      - name: Preserve managed LF line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Run Windows governance
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.ref_name }}' -eq '${{ github.event.repository.default_branch }}') {
            Write-Host 'Protected merge receipt is terminal; skipping ticket-governance replay.'
          } elseif ($env:EVENT_NAME -eq 'pull_request' -or $env:EVENT_NAME -eq 'pull_request_review') {
            if ([string]::IsNullOrWhiteSpace($env:EVENT_BASE_REF) -or $env:EVENT_BASE_REF.Contains('..') -or $env:EVENT_BASE_REF.StartsWith('/')) {
              throw 'Event governance requires a safe base ref.'
            }
            if ($env:EVENT_HEAD -notmatch '^[0-9a-f]{40}$' -or $env:EVENT_HEAD -eq ('0' * 40)) {
              throw 'Event governance requires an exact non-zero head SHA.'
            }
            git fetch --no-tags origin "+refs/heads/$($env:EVENT_BASE_REF):refs/remotes/origin/$($env:EVENT_BASE_REF)"
            if ($LASTEXITCODE -ne 0) { throw 'base branch fetch failed' }
            $base = (git merge-base "origin/$($env:EVENT_BASE_REF)" $env:EVENT_HEAD).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'pull-request merge-base resolution failed' }
            if ($base -notmatch '^[0-9a-f]{40}$' -or $base -eq ('0' * 40)) {
              throw 'Event governance requires an exact non-zero merge base.'
            }
            ./project/governance-check.bat --actor ci --base $base --head $env:EVENT_HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Windows governance failed' }
          } else {
            git fetch --no-tags origin "+refs/heads/$($env:DEFAULT_BRANCH):refs/remotes/origin/$($env:DEFAULT_BRANCH)"
            if ($LASTEXITCODE -ne 0) { throw 'default branch fetch failed' }
            $base = (git merge-base "origin/$($env:DEFAULT_BRANCH)" $env:EVENT_HEAD).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'default branch merge-base resolution failed' }
            if ($base -notmatch '^[0-9a-f]{40}$' -or $base -eq ('0' * 40)) {
              throw 'Event governance requires an exact non-zero merge base.'
            }
            ./project/governance-check.bat --actor ci --base $base --head $env:EVENT_HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Windows governance failed' }
          }
