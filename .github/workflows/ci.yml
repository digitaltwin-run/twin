name: twin-ci

on:
  push:
  pull_request:
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    if: >-
      (github.event_name == 'push' &&
      github.ref_name == github.event.repository.default_branch) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_review'
    permissions:
      contents: read
      pull-requests: read
    uses: wellmanifest/new-project/.github/workflows/governance.yml@268311ba502cfa5306262f709e8086011c95088a
    with:
      standard-ref: 268311ba502cfa5306262f709e8086011c95088a
      trusted-validator-apps: 'ifuri-validator-agent[bot]'

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate contracts and tests
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 -m json.tool .governance/manifest.json >/dev/null
          python3 -m json.tool .governance/manifest.lock.json >/dev/null
          if [[ -d tests ]]; then
            PYTHONPATH=src python3 -m unittest discover -s tests -v
          fi
          if [[ "${{ github.ref_name }}" == "${{ github.event.repository.default_branch }}" ]]; then
            ./project/governance-check.sh --actor ci --changed-file project/TICKETS.md
          else
            if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "pull_request_review" ]]; then
              base="$EVENT_BASE"
              if [[ ! "$base" =~ ^[0-9a-f]{40}$ || "$base" == 0000000000000000000000000000000000000000 ]]; then
                echo "Pull-request governance requires an exact event base SHA." >&2
                exit 1
              fi
            else
              git fetch --no-tags origin "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
              base="$(git merge-base "origin/${DEFAULT_BRANCH}" "$EVENT_HEAD")"
            fi
            ./project/governance-check.sh --actor ci --base "$base" --head "$EVENT_HEAD"
          fi
      - name: Validate networkless container
        shell: bash
        run: |
          set -euo pipefail
          docker build -t twin-ci .
          docker run --rm --network none twin-ci

  windows-governance:
    runs-on: windows-latest
    steps:
      - name: Preserve managed LF line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Run Windows governance
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.ref_name }}' -eq '${{ github.event.repository.default_branch }}') {
            ./project.bat --actor ci --changed-file project/TICKETS.md
          } else {
            if ($env:EVENT_NAME -eq 'pull_request' -or $env:EVENT_NAME -eq 'pull_request_review') {
              $base = $env:EVENT_BASE
              if ($base -notmatch '^[0-9a-f]{40}$' -or $base -eq ('0' * 40)) {
                throw 'Pull-request governance requires an exact event base SHA.'
              }
            } else {
              git fetch --no-tags origin "refs/heads/$($env:DEFAULT_BRANCH):refs/remotes/origin/$($env:DEFAULT_BRANCH)"
              if ($LASTEXITCODE -ne 0) { throw 'default branch fetch failed' }
              $base = (git merge-base "origin/$($env:DEFAULT_BRANCH)" $env:EVENT_HEAD).Trim()
              if ($LASTEXITCODE -ne 0) { throw 'default branch merge-base resolution failed' }
            }
            ./project.bat --actor ci --base $base --head $env:EVENT_HEAD
          }
          if ($LASTEXITCODE -ne 0) { throw 'Windows governance failed' }
